<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tổng quan dock – Kho nhập</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1f7;--panel:#fff;--ink:#18222e;--mute:#66758a;--line:#dbe2ee;--blue:#2f6fd0;--hz:#f2b705;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161d;--panel:#1a222c;--ink:#e8edf2;--mute:#93a1b0;--line:#2c3743;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161d;--panel:#1a222c;--ink:#e8edf2;--mute:#93a1b0;--line:#2c3743;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:14px 18px}
h1{margin:0;font-size:19px}.sub{color:var(--mute);font-size:12px}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 14px;min-width:96px}
.stat b{display:block;font-size:22px;line-height:1.1}.stat span{font-size:11px;color:var(--mute)}
main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding:0 18px 18px}
@media (max-width:960px){main{grid-template-columns:1fr}}
.scene{background:linear-gradient(160deg,#f4f7fd,#e3eaf8);border:1px solid var(--line);border-radius:14px;overflow:hidden}
svg{display:block;width:100%;height:auto}
text{font-family:inherit}
.hit{fill:transparent;cursor:pointer}.hit:hover{fill:rgba(242,183,5,.2)}.hit:focus-visible{stroke:#f2b705;stroke-width:3;outline:none}
.tc{transition:transform 1.8s cubic-bezier(.3,.7,.3,1),opacity .6s}.tc.st{transition:none}
.tg{fill:#7b8798}.slot[data-s=busy] .tg{fill:#2f6fd0}.slot[data-s=moving] .tg{fill:#e08a00}
.tt{fill:#fff;font-size:10.5px;font-weight:700}
.wt{transition:transform 1s cubic-bezier(.4,.1,.3,1),opacity .8s;cursor:pointer}.wt .pt{display:none}.wt.sel .pt{display:block}.wt.sel .bd{filter:drop-shadow(0 0 2px #f2b705) drop-shadow(0 0 4px #f2b705)}.bg circle{fill:#2f6fd0;stroke:#fff;stroke-width:1.5}.bg text{fill:#fff;font-size:10px;font-weight:700}
.trk .pt{display:none}.trk.mv .pt,.trk.bs .pt,.trk.sel .pt{display:block}.trk .bg{display:none}.trk.wt .bg{display:block}.trk.wt{cursor:pointer}.trk .tg{fill:#7b8798}.trk.mv .tg{fill:#e08a00}.trk.bs .tg,.trk.wt .tg{fill:#2f6fd0}.trk.sel .body{filter:drop-shadow(0 0 2px #f2b705) drop-shadow(0 0 4px #f2b705)}.trk .hz{fill:#ff9d00;opacity:0}.trk.mv .hz,.trk.bs .hz{animation:blink .7s infinite}
.hz{fill:#ff9d00;opacity:0}
.slot[data-s=moving] .hz,.slot[data-s=busy] .hz{animation:blink .7s infinite}
.slot[data-s=moving] .bd{animation:bob .3s infinite}.slot[data-s=busy] .bd{animation:bob2 .22s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.1}}
@keyframes bob{50%{transform:translateY(-1px)}}@keyframes bob2{50%{transform:translateY(-.4px)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{margin:0 0 8px;font-size:15px}
.chip{display:inline-block;font-size:12px;font-weight:500;padding:2px 10px;border-radius:999px;background:#e6f1ff;color:#2f6fd0}
.chip.free{background:#e3f6ec;color:#23865a}.chip.moving{background:#fff0d6;color:#b86c00}
.mut{color:var(--mute);font-size:12px;margin-left:6px}
.prog{height:7px;border-radius:4px;background:var(--line);margin:10px 0 2px;overflow:hidden}.prog i{display:block;height:100%;background:#2e9e6b;transition:width .8s}
.pn{text-align:right;font-size:12px;color:var(--mute)}
dl{margin:8px 0;display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px}dt{color:var(--mute)}dd{margin:0;text-align:right;font-weight:500}
button.act{font:inherit;font-size:13px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.pri{background:var(--hz);border-color:var(--hz);color:#1a1400;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tp{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:2px 10px}.tp i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer;background:transparent;width:100%;text-align:left;color:inherit;font:inherit}
.q.sel{outline:3px solid var(--hz)}.q.old .w{color:#d6453d;font-weight:700}
.q .n{grid-row:span 2;width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:700}
.q .p{font-weight:700}.q .s{font-size:11px;color:var(--mute);grid-column:2}.q .w{font-variant-numeric:tabular-nums;font-size:12px}
.hint{font-size:12px;color:var(--mute);margin:8px 0 0}
#confirm{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:0 18px 12px;padding:10px 14px;border-radius:10px;background:var(--hz);color:#1a1400;gap:12px;align-items:center;flex-wrap:wrap}
#confirm.show{display:flex}#confirm span{flex:1;min-width:200px}
@media (prefers-reduced-motion:reduce){.tc{transition-duration:.01s}.bd,.hz{animation:none!important}}
</style>
</head>
<body>
<header>
  <div><h1>Tổng quan dock – Kho nhập</h1><div class="sub">Bản demo, dữ liệu giả lập · <span id="clock"></span></div></div>
  <div class="stats">
    <div class="stat"><b id="sFree">0</b><span>Dock trống</span></div>
    <div class="stat"><b id="sBusy">0</b><span>Đang dỡ hàng</span></div>
    <div class="stat"><b id="sQ">0</b><span>Xe đang chờ</span></div>
    <div class="stat"><b id="sMax">0:00</b><span>Chờ lâu nhất</span></div>
  </div>
</header>
<div id="confirm"><span id="cmsg"></span><button class="act pri" id="cyes">Xác nhận gọi</button><button class="act" id="cno">Hủy</button></div>
<main>
  <div class="scene"><svg id="svg" viewBox="-380 -150 1030 740" role="img" aria-label="Sơ đồ 12 cửa dock"></svg></div>
  <div>
    <div class="card" id="info"></div>
    <div class="card">
      <h2>Hàng đợi</h2><div class="chips" id="chips"></div><div id="queue"></div>
      <button class="act pri" id="add">Thêm xe giả lập</button>
      <p class="hint">Chọn một xe trong hàng đợi, rồi bấm vào dock để gọi xe vào. Bấm dock khi chưa chọn xe để xem thông tin dock.</p>
    </div>
  </div>
</main>
<script>
var K=.866,NS="http://www.w3.org/2000/svg";
var COL={free:"#2e9e6b",moving:"#e08a00",busy:"#2f6fd0"},TXT={free:"Dock trống",moving:"Đang lùi vào",busy:"Đang dỡ hàng"};
var TY={small:{n:"Xe tải nhỏ",w:34,lb:55,hb:38,lc:24,hc:30,c:"#2f6fd0"},van:{n:"Xe van",w:32,lb:40,hb:34,lc:24,hc:30,c:"#2e9e6b"},big:{n:"Xe tải lớn",w:40,lb:92,hb:52,lc:30,hc:40,c:"#d98a3d"},cont:{n:"Container",w:42,lb:118,hb:58,lc:30,hc:40,c:"#b5566b"}};
var SUP=["Zuellig Pharma","DKSH","Sanofi","Pymepharco","Traphaco","OPC","Imexpharm","Dược Hậu Giang","Stada","Mekophar"];
var seq=0,selQ=null,selD=2,pend=null,queue=[],docks=[];
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function pt(x,y,z){return[(x-y)*K,(x+y)*.5-z]}
function pl(a,f,s,x){return'<polygon points="'+a.map(function(p){return pt(p[0],p[1],p[2]).map(function(v){return v.toFixed(1)}).join(",")}).join(" ")+'" fill="'+f+'"'+(s?' stroke="'+s+'" stroke-width="1" stroke-linejoin="round"':"")+(x||"")+'/>'}
function box(x,y,z,w,l,h,ct,cr,cf){return pl([[x,y,z+h],[x+w,y,z+h],[x+w,y+l,z+h],[x,y+l,z+h]],ct)+pl([[x+w,y,z],[x+w,y+l,z],[x+w,y+l,z+h],[x+w,y,z+h]],cr)+pl([[x,y+l,z],[x+w,y+l,z],[x+w,y+l,z+h],[x,y+l,z+h]],cf)}
function sh(c,f){var n=parseInt(c.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,t=f<0?0:255,p=Math.abs(f);return"rgb("+Math.round(r+(t-r)*p)+","+Math.round(g+(t-g)*p)+","+Math.round(b+(t-b)*p)+")"}
function fmt(ms){var s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+":"+("0"+s%60).slice(-2)}
function newTruck(m){seq++;return{id:seq,type:rnd(Object.keys(TY)),plate:"60"+rnd(["C","H","K"])+"-"+(100+Math.floor(Math.random()*899))+"."+(10+Math.floor(Math.random()*89)),sup:rnd(SUP),p:6+Math.floor(Math.random()*9),at:Date.now()-(m||0)*60000}}

function truckSVG(t,cx,i,wait){var T=TY[t.type],x=cx-T.w/2,y=8,yc=y+T.lb,c=T.c,W=x+T.w,s="";
  s+=box(x,y,10,T.w,T.lb,T.hb,"#fff","#e3e9f5","#cfd8ea");
  s+=pl([[W,y+6,10+T.hb*.3],[W,y+T.lb-6,10+T.hb*.3],[W,y+T.lb-6,10+T.hb*.55],[W,y+6,10+T.hb*.55]],c);
  s+=box(x+1,yc,10,T.w-2,T.lc,T.hc,sh(c,.25),c,sh(c,-.2));
  s+=pl([[x+4,yc+T.lc,10+T.hc*.45],[W-4,yc+T.lc,10+T.hc*.45],[W-4,yc+T.lc,6+T.hc],[x+4,yc+T.lc,6+T.hc]],"#c4dcf7");
  s+=pl([[W-1,yc+3,10+T.hc*.45],[W-1,yc+T.lc*.65,10+T.hc*.45],[W-1,yc+T.lc*.65,6+T.hc],[W-1,yc+3,6+T.hc]],"#c4dcf7");
  [y+8,y+26,yc+4].forEach(function(wy,k){if(k===1&&T.lb<80)return;s+=box(W-2,wy,0,4,14,13,"#3a4150","#2a303b","#222")});
  var h=pt(cx,yc+T.lc/2,10+T.hc+2),a=pt(cx,y+T.lb/2,10+T.hb),up=i%2?40:26;
  if(wait){return'<g class="bd">'+s+'</g><g class="pt" transform="translate('+a[0]+','+(a[1]-34)+')"><rect class="tg" style="fill:#2f6fd0" x="-36" y="-10" width="72" height="20" rx="10"/><text class="tt" y="4" text-anchor="middle">'+t.plate+'</text></g><g class="bg" transform="translate('+a[0]+','+(a[1]-6)+')"><circle r="9"/><text y="3.5" text-anchor="middle">1</text></g>'}
  return'<g class="bd">'+s+'<circle class="hz" cx="'+h[0]+'" cy="'+h[1]+'" r="2.8"/></g>'
   +'<g transform="translate('+a[0]+','+(a[1]-up)+')"><rect class="tg" x="-36" y="-10" width="72" height="20" rx="10"/><path class="tg" d="M-5 10h10l-5 6z"/><text class="tt" y="4" text-anchor="middle">'+t.plate+'</text></g>'}

function scene(){var f="",w="",sl="",h="",i,cx,id;
  f+=pl([[-30,0,0],[750,0,0],[750,400,0],[-30,400,0]],"#f1f4fb","#d3dcee");
  f+=pl([[-30,238,0],[750,238,0],[750,400,0],[-30,400,0]],"#e4eaf7");f+=pl([[-30,192,0],[750,192,0],[750,238,0],[-30,238,0]],"#d8e1f4");f+='<polyline fill="none" stroke="#f2b705" stroke-width="2" stroke-dasharray="10 8" points="'+pt(-30,215,0)+" "+pt(750,215,0)+'"/>';f+=(function(){var q="";for(var k=0;k<=12;k++)q+='<polyline fill="none" stroke="#fff" stroke-width="2" points="'+pt(k*60,242,0)+" "+pt(k*60,395,0)+'"/>';return q})();
  f+='<g transform="matrix(.866,.5,-.866,.5,0,0)"><text x="20" y="392" font-size="13" font-weight="700" fill="rgba(47,111,208,.55)">Khu vực xe chờ ngoài cổng</text></g>';
  w+=box(-8,-14,0,736,14,100,"#fafbff","#c3cfe6","#dce5f5");
  w+=pl([[-8,0,92],[728,0,92],[728,0,100],[-8,0,100]],"#2f6fd0");
  for(i=0;i<12;i++){cx=30+i*60;id=(i<6?"A"+(i+1):"B"+(i-5));
    f+=pl([[cx-26,0,0],[cx+26,0,0],[cx+26,165,0],[cx-26,165,0]],"#2e9e6b",null,' id="fl'+i+'" fill-opacity=".12" stroke="#f2b705" stroke-width="1.5" stroke-dasharray="6 5"');
    w+=pl([[cx-22,0,0],[cx+22,0,0],[cx+22,0,68],[cx-22,0,68]],"#7f93b8","#2e9e6b",' id="dr'+i+'" stroke-width="3"');
    w+=box(cx-14,-3,0,28,3,22,"#ecc896","#cfa66a","#dcb77d");
    var l=pt(cx,0,82);w+='<rect id="lb'+i+'" x="'+(l[0]-14)+'" y="'+(l[1]-8)+'" width="28" height="16" rx="4" fill="#2e9e6b"/><text x="'+l[0]+'" y="'+(l[1]+4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">'+id+'</text>';
    sl+='<g class="slot" id="sl'+i+'" data-s="free"></g>';
    h+='<polygon class="hit" id="ht'+i+'" tabindex="0" role="button" aria-label="Dock '+id+'" points="'+[pt(cx-26,0,80),pt(cx+26,0,80),pt(cx+26,165,0),pt(cx-26,165,0)].join(" ")+'"/>';
    docks.push({i:i,id:id,cx:cx,truck:null,tel:null,tt:null,s:"free",since:0})}
  document.getElementById("svg").innerHTML=f+w+sl+'<g id="wl"></g>'+h;
  docks.forEach(function(d){d.sl=document.getElementById("sl"+d.i);var ht=document.getElementById("ht"+d.i);
    ht.onclick=function(){clickDock(d)};ht.onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();clickDock(d)}}})}

function paint(d){var c=COL[d.s],fl=document.getElementById("fl"+d.i);d.sl.dataset.s=d.s;
  fl.setAttribute("fill",c);fl.setAttribute("fill-opacity",d.s==="free"?.12:.25);
  fl.setAttribute("stroke",selD===d.i?"#18222e":"#f2b705");fl.setAttribute("stroke-width",selD===d.i?3:1.5);
  document.getElementById("dr"+d.i).setAttribute("stroke",c);document.getElementById("lb"+d.i).setAttribute("fill",c)}
function place(d,t,instant){if(d.tel)leave(d);
  d.truck=t;d.s=instant?"busy":"moving";d.since=Date.now()-(instant?12000+Math.random()*20000:0);
  var g=document.createElementNS(NS,"g");g.setAttribute("class","tc"+(instant?" st":""));g.innerHTML=truckSVG(t,d.cx,d.i);
  d.tel=g;d.sl.appendChild(g);
  if(instant){setTimeout(function(){g.classList.remove("st")},80)}
  else{g.style.opacity=0;g.style.transform="translate("+(-320*K)+"px,160px)";
    requestAnimationFrame(function(){requestAnimationFrame(function(){g.style.transform="translate(0,0)";g.style.opacity=1})});
    setTimeout(function(){if(d.truck===t){d.s="busy";d.since=Date.now();paint(d);stats();info()}},1900)}
  paint(d)}
function leave(d){var o=d.tel;if(o){o.style.transition="transform 1.4s cubic-bezier(.6,0,.9,.6),opacity 1.3s";o.style.transform="translate("+(-380*K)+"px,190px)";o.style.opacity=0;setTimeout(function(){o.remove()},1500)}d.tel=null;d.truck=null;d.s="free"}
function finish(d){leave(d);paint(d);stats();info()}
function clickDock(d){if(selQ){request(d)}else{var o=selD;selD=d.i;paint(docks[o]);paint(d);info()}}
function request(d,useFirst){var t=useFirst?queue[0]:queue.find(function(q){return q.id===selQ});
  if(!t){toast("Hàng đợi đang trống. Bấm \"Thêm xe giả lập\" để thử.");return}
  if(d.truck){pend={d:d,t:t};cmsg.textContent=d.id+" đang có xe "+d.truck.plate+" ("+(d.s==="busy"?"đang dỡ":"đang lùi vào")+"). Gọi xe "+t.plate+" vào thì xe cũ sẽ rời đi ngay.";cyes.style.display="";confirm_.classList.add("show");return}
  call(d,t)}
function call(d,t){leaveWait(t.id);queue=queue.filter(function(q){return q.id!==t.id});selQ=null;var o=selD;selD=d.i;paint(docks[o]);place(d,t,false);renderQ();stats();info()}
function toast(m){pend=null;cmsg.textContent=m;cyes.style.display="none";confirm_.classList.add("show");setTimeout(function(){confirm_.classList.remove("show")},2800)}
var confirm_=document.getElementById("confirm"),cmsg=document.getElementById("cmsg"),cyes=document.getElementById("cyes");
cyes.onclick=function(){if(pend)call(pend.d,pend.t);pend=null;confirm_.classList.remove("show")};
document.getElementById("cno").onclick=function(){pend=null;confirm_.classList.remove("show")};

function info(){var d=docks[selD],t=d.truck,b=document.getElementById("info");
  if(!t){b.innerHTML='<span class="chip free">Dock trống</span><span class="mut">Dock '+d.id+'</span><p class="hint">Chưa có xe. Gọi xe đầu hàng đợi vào dock này, hoặc chọn một xe trong hàng đợi rồi bấm vào dock.</p><button class="act pri" id="btnCall">Gọi xe đầu hàng vào '+d.id+'</button>';return}
  b.innerHTML='<span class="chip '+d.s+'">'+TXT[d.s]+'</span><span class="mut">Dock '+d.id+'</span><h2 style="margin:10px 0 0">'+t.plate+'</h2><div class="prog"><i id="pg"></i></div><div class="pn" id="pn"></div>'
   +'<dl><dt>Nhà cung cấp</dt><dd>'+t.sup+'</dd><dt>Loại xe</dt><dd>'+TY[t.type].n+'</dd><dt>Thời gian dỡ</dt><dd id="tm"></dd></dl>'
   +(d.s==="busy"?'<button class="act pri" id="btnDone">Hoàn tất dỡ hàng</button>':'');tickInfo()}
function tickInfo(){var d=docks[selD],t=d.truck;if(!t||!document.getElementById("pg"))return;
  var pr=d.s==="busy"?Math.min(1,(Date.now()-d.since)/(t.p*5000)):0;
  pg.style.width=pr*100+"%";pn.textContent=Math.floor(pr*t.p)+"/"+t.p+" pallet";tm.textContent=d.s==="busy"?fmt(Date.now()-d.since):"–"}
document.getElementById("info").onclick=function(e){var d=docks[selD];if(e.target.id==="btnDone")finish(d);if(e.target.id==="btnCall")request(d,true)};

function renderQ(){var box=document.getElementById("queue");box.innerHTML="";
  queue.forEach(function(t,i){var b=document.createElement("button");b.className="q"+(selQ===t.id?" sel":"");b.dataset.id=t.id;
    b.innerHTML='<span class="n">'+(i+1)+'</span><span class="p">'+t.plate+'</span><span class="w"></span><span class="s">'+TY[t.type].n+" · "+t.sup+"</span>";
    b.onclick=function(){selQ=selQ===t.id?null:t.id;renderQ()};box.appendChild(b)});
  if(!queue.length)box.innerHTML='<p class="hint">Không có xe nào đang chờ.</p>';
  var cnt={};queue.forEach(function(t){cnt[t.type]=(cnt[t.type]||0)+1});
  document.getElementById("chips").innerHTML=Object.keys(TY).map(function(k){return'<span class="tp"><i style="background:'+TY[k].c+'"></i>'+TY[k].n+": <b>"+(cnt[k]||0)+"</b></span>"}).join("");renderWait();tick()}
var WE={};
function wpos(j){var dx=j*60,dy=200;return[(dx-dy)*K,(dx+dy)*.5]}
function renderWait(){queue.forEach(function(t,j){var el=WE[t.id],p=wpos(Math.min(j,11));
  if(!el){el=document.createElementNS(NS,"g");el.setAttribute("class","wt");el.innerHTML=truckSVG(t,30,0,true);
    el.style.opacity=0;el.style.transform="translate("+(p[0]-260*K)+"px,"+(p[1]+130)+"px)";
    el.onclick=function(){selQ=selQ===t.id?null:t.id;renderQ()};
    document.getElementById("wl").appendChild(el);WE[t.id]=el;
    requestAnimationFrame(function(){requestAnimationFrame(function(){el.style.opacity=1;el.style.transform="translate("+el._p[0]+"px,"+el._p[1]+"px)"})})}
  else{el.style.transform="translate("+p[0]+"px,"+p[1]+"px)"}
  el._p=p;el.querySelector(".bg text").textContent=j+1;el.classList.toggle("sel",selQ===t.id);el.style.display=j>11?"none":""})}
